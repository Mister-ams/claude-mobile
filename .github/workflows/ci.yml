name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

jobs:
  syntax:
    name: syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: server.js syntax
        run: node --check server.js

      # The client is now an external file, so it is checked directly rather
      # than regex-extracted out of the HTML.
      - name: public/app.js syntax
        run: node --check public/app.js

      # index.html should no longer carry an inline script block at all.
      # Guard the extraction against regressing.
      - name: no inline script blocks in index.html
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('public/index.html', 'utf8');
            const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
            let m, count = 0, ok = true;
            while ((m = re.exec(html))) {
              count++;
              try { new Function(m[1]); }
              catch (e) {
                console.error('Block ' + count + ' syntax error: ' + e.message);
                ok = false;
              }
            }
            if (count > 0) {
              console.error(count + ' inline script block(s) found -- the client belongs in public/app.js');
              process.exit(1);
            }
            console.log('no inline script blocks, as expected');
            process.exit(ok ? 0 : 1);
          "

      # index.html loads /app.js?v=<version> as the cache-bust. iOS Safari
      # serves stale assets across a pm2 restart even under no-cache headers
      # (HANDOVER.md), so that query is what actually busts it -- and it is
      # only load-bearing if it tracks package.json. Enforced here rather than
      # left to a manual step.
      - name: asset version matches package.json
        run: npm run verify:asset-version
