name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

jobs:
  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci installs exactly the tree in package-lock.json and fails when
      # package.json and the lockfile have drifted. install.sh and update.sh
      # run the same command, so CI proves what the installers actually do.
      - name: install from lockfile
        run: npm ci

      - name: audit (high severity and above)
        run: npm audit --audit-level=high

  syntax:
    name: syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: server.js syntax
        run: node --check server.js

      - name: public/index.html inline JS syntax
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('public/index.html', 'utf8');
            const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
            let m, count = 0, ok = true;
            while ((m = re.exec(html))) {
              count++;
              try { new Function(m[1]); }
              catch (e) {
                console.error('Block ' + count + ' syntax error: ' + e.message);
                ok = false;
              }
            }
            console.log(count + ' inline scripts checked, ' + (ok ? 'all OK' : 'ERRORS'));
            process.exit(ok ? 0 : 1);
          "
