herdr_spike_findings:
  q1_stream_fidelity: >
    FALSIFIED. pane.read returns a flat string; a whole-schema search finds zero
    hits for hyperlink/cell/sgr/fg/bg. format:"ansi" preserves all SGR but
    OSC-8 hyperlinks are DROPPED in all 16 source x format x strip combinations
    -- the URL never crosses the socket. No push output stream either, only
    pattern-triggered pane.output_matched. T31 is impossible, and adopting
    herdr means deleting the hyperlink feature we just secured.
  q2_agent_state: >
    Hypothesis falsified (Claude IS detected under BOTH native and cmd.exe
    interop) but a worse problem found: the manifest bundled in pinned v0.8.0
    reported a genuinely busy Claude as `idle` for 367 consecutive samples --
    it expects a braille spinner while Claude Code 2.1.78 emits an asterisk
    glyph. Fixed only after fetching a remote manifest update. PINNING THE
    BINARY DOES NOT PIN AGENT-STATE BEHAVIOUR. Also WSLENV is empty, so the
    integration hook cannot work under interop -- native-in-WSL launch is
    mandatory for session refs.
  q3_restart_restore: >
    Shape yes, conversation NO. Workspaces/panes/ids/layout/cwd restore
    identically, but `agents` went from three Claudes to [], panes returned as
    plain /bin/bash, and session.json contains zero agent/session/resume refs.
    True conversation resume remains UNVERIFIED -- it requires Claude
    authenticated inside WSL, an operator secret-handling action.
  q4_input_atomicity: >
    SOLVED -- the one clear win. pane.send_input {text, keys:["enter"]}
    delivered 229 chars plus submit in one round-trip, 103ms, unbroken. But it
    is achievable on the existing node-pty path with no new dependency.
  blocker: >
    v0.8.0 ships NO Windows binary (linux/macos only; Windows is preview
    channel), so the Windows-side Node server cannot reach a WSL2 unix socket
    as T27 assumed. Adopting herdr would require moving the Node server into
    WSL or building a bridge.
  socket: /root/.config/herdr/herdr.sock, 0600 root:root inside /root (0700), no auth.

corrections_to_earlier_assessments:
  - >
    SECURITY ASSESSMENT WAS WRONG ON DEPENDENCIES. It recorded "known-CVE
    dependency versions: none". npm audit found 4, including a HIGH in ws
    (GHSA-58qx-3vcg-4xpx, uninitialized memory disclosure) -- and ws is the
    transport for every session. Checked against an older advisory set.
  - >
    T23's stated fix was insufficient. `wsl.exe -- <cmd>` does NOT exec; it
    joins everything after -- into one string for the login shell, so there
    were TWO shell layers and plain execFileSync would have looked fixed while
    still shell-parsing. Requires --exec.
  - >
    T04 had an unflagged blocker: 21 inline handler attributes in index.html
    plus inline <script> blocks in setup.html and gen-icon.html. T03 moved the
    main block only.
  - >
    W2 column gain was better than predicted: 140 cols at 16px vs 48 on phone
    (2.9x, not the estimated 2x).

