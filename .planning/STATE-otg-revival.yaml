key_findings_carried:
  security:
    - R1 HIGH LIVE -- OSC-8 XSS, public/index.html:1008-1010, no scheme allowlist.
    - C1 CRITICAL(crypto) -- AES-GCM nonce reuse across directions; server.js:336-337 + client mirror.
    - NOT vulnerable -- isLocalhost XFF spoofing (proxy-addr returns first untrusted hop). Do not re-investigate.
    - NOT vulnerable -- msg.session command injection (numeric Map keys).
    - Biggest real risk is supply chain, not any single finding.
  architecture:
    - ~520 LOC of server.js exists only because dtach has no API or agent-state.
    - herdr v0.8.0, Apache-2.0, herdrdev/herdr -- pin the version, pre-1.0 protocol churn.
    - herdr socket has NO auth; our auth layer remains the phone-facing boundary.
  client:
    - No hardware-keyboard path exists at all; all 4 keydown listeners are form-scoped.
    - style.css has zero width breakpoints.
    - Hardware keyboard means the software keyboard never appears -> full screen, larger font,
      and the most bug-prone iOS keyboard code stops being exercised.
