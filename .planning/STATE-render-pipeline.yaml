retrospective:
  - date: 2026-05-04
    note: |
      Initiative shipped end-to-end across two sessions (May 1-2 + May 4).
      The W6 history-render bug was a 1-line miss at index.html:735;
      diagnosis took ~2 hours through wire-level probe + Playwright A/B.
      The 11-patch polish run that followed was driven by real symptoms
      observed during soak (user reloading on phone, surfacing iOS-specific
      issues like font-loading timing, ResizeObserver gaps, touch-action
      defaults). Each patch corresponded to a real symptom rather than
      speculative refinement. T24 retry succeeded cleanly because the
      polish work bounded all reproducible failure modes.
